<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0f35"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
    <linearGradient id="redLiq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8a80"/>
      <stop offset="100%" stop-color="#e53935"/>
    </linearGradient>
    <linearGradient id="blueLiq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#82b1ff"/>
      <stop offset="100%" stop-color="#1e88e5"/>
    </linearGradient>
    <linearGradient id="purpLiq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ce93d8"/>
      <stop offset="100%" stop-color="#8e24aa"/>
    </linearGradient>
    <clipPath id="c1"><rect x="158" y="318" width="56" height="138" rx="12"/></clipPath>
    <clipPath id="c2"><rect x="228" y="296" width="56" height="160" rx="12"/></clipPath>
    <clipPath id="c3"><rect x="298" y="318" width="56" height="138" rx="12"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Ambient orbs -->
  <circle cx="120" cy="110" r="200" fill="#7c3aed" opacity="0.13"/>
  <circle cx="420" cy="430" r="180" fill="#1d4ed8" opacity="0.13"/>

  <!-- ── DOG ── -->

  <!-- Left ear (rendered behind head) -->
  <ellipse cx="172" cy="193" rx="52" ry="74" fill="#9a6440" transform="rotate(-20 172 193)"/>
  <ellipse cx="172" cy="200" rx="34" ry="52" fill="#c07a50" transform="rotate(-20 172 200)"/>

  <!-- Right ear -->
  <ellipse cx="340" cy="193" rx="52" ry="74" fill="#9a6440" transform="rotate(20 340 193)"/>
  <ellipse cx="340" cy="200" rx="34" ry="52" fill="#c07a50" transform="rotate(20 340 200)"/>

  <!-- Head -->
  <circle cx="256" cy="200" r="110" fill="#d4a46e"/>

  <!-- Muzzle -->
  <ellipse cx="256" cy="256" rx="62" ry="48" fill="#e8c89c"/>

  <!-- Eyes -->
  <circle cx="213" cy="186" r="19" fill="#1a1a1a"/>
  <circle cx="299" cy="186" r="19" fill="#1a1a1a"/>
  <!-- Eye shine primary -->
  <circle cx="219" cy="180" r="8" fill="white" opacity="0.92"/>
  <circle cx="305" cy="180" r="8" fill="white" opacity="0.92"/>
  <!-- Eye shine secondary -->
  <circle cx="207" cy="191" r="3.5" fill="white" opacity="0.45"/>
  <circle cx="293" cy="191" r="3.5" fill="white" opacity="0.45"/>

  <!-- Nose -->
  <ellipse cx="256" cy="237" rx="23" ry="15" fill="#1a1a1a"/>
  <ellipse cx="248" cy="233" rx="9" ry="5" fill="white" opacity="0.22"/>

  <!-- Mouth -->
  <path d="M233,262 Q256,282 279,262" stroke="#9a6440" stroke-width="4.5" fill="none" stroke-linecap="round"/>

  <!-- ── TUBES ── -->

  <!-- Tube 1 — red over blue -->
  <rect x="170" y="307" width="28" height="13" rx="5" fill="rgba(255,255,255,0.28)"/>
  <rect x="158" y="318" width="56" height="138" rx="12" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.22)" stroke-width="2"/>
  <rect x="158" y="318" width="56" height="64" clip-path="url(#c1)" fill="url(#redLiq)"/>
  <rect x="158" y="382" width="56" height="74" clip-path="url(#c1)" fill="url(#blueLiq)"/>
  <rect x="163" y="323" width="11" height="84" rx="5" fill="rgba(255,255,255,0.13)"/>

  <!-- Tube 2 (taller) — purple over red -->
  <rect x="240" y="285" width="28" height="13" rx="5" fill="rgba(255,255,255,0.28)"/>
  <rect x="228" y="296" width="56" height="160" rx="12" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.22)" stroke-width="2"/>
  <rect x="228" y="296" width="56" height="76" clip-path="url(#c2)" fill="url(#purpLiq)"/>
  <rect x="228" y="372" width="56" height="84" clip-path="url(#c2)" fill="url(#redLiq)"/>
  <rect x="233" y="301" width="11" height="98" rx="5" fill="rgba(255,255,255,0.13)"/>

  <!-- Tube 3 — blue over purple -->
  <rect x="310" y="307" width="28" height="13" rx="5" fill="rgba(255,255,255,0.28)"/>
  <rect x="298" y="318" width="56" height="138" rx="12" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.22)" stroke-width="2"/>
  <rect x="298" y="318" width="56" height="60" clip-path="url(#c3)" fill="url(#blueLiq)"/>
  <rect x="298" y="378" width="56" height="78" clip-path="url(#c3)" fill="url(#purpLiq)"/>
  <rect x="303" y="323" width="11" height="84" rx="5" fill="rgba(255,255,255,0.13)"/>
</svg>
