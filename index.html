<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐕</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Magic Sort" />
    <meta name="theme-color" content="#0d1b2a" />
    <title>Magic Sort 🐕</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      html {
        height: 100%;
        height: -webkit-fill-available;
        background: #0d1b2a;
      }
      body {
        height: 100%;
        min-height: 100vh;
        min-height: -webkit-fill-available;
        background: #0d1b2a;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        overflow: hidden;
      }
      #root { width: 100%; height: 100%; }

      @keyframes floatDog {
        0%, 100% { transform: translateY(0) rotate(-8deg) scale(1); }
        50%       { transform: translateY(-14px) rotate(8deg) scale(1.06); }
      }
      @keyframes glowPulse {
        0%, 100% { filter: drop-shadow(0 0 10px rgba(180,120,255,0.5)); }
        50%       { filter: drop-shadow(0 0 28px rgba(180,120,255,0.9)); }
      }
      @keyframes celebrate {
        0%   { transform: scale(0) rotate(-30deg); }
        65%  { transform: scale(1.3) rotate(10deg); }
        100% { transform: scale(1) rotate(0deg); }
      }
      @keyframes slideUp {
        from { transform: translateY(20px); }
        to   { transform: translateY(0); }
      }
      @keyframes starPop {
        0%   { transform: scale(0) rotate(-45deg); }
        70%  { transform: scale(1.4) rotate(10deg); }
        100% { transform: scale(1) rotate(0deg); }
      }

      .float-dog  { animation: floatDog  3s ease-in-out infinite; }
      .glow-pulse { animation: glowPulse 2.5s ease-in-out infinite; }
      .celebrate  { animation: celebrate 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards; }
      .slide-up   { animation: slideUp   0.4s ease-out; }
      .star-pop   { animation: starPop   0.4s cubic-bezier(0.34,1.56,0.64,1) forwards; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
